<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes - AulaHub</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="laboratorioStyles.css">
</head>
<body>
    <header class="header"></header>
    <div class="toasts"></div>

    <div class="content">
        <h2>Configuraciones</h2>
        
        <div class="config-container">
            <h4 style="margin-bottom: 15px; color: #666; font-size: 12px; text-transform: uppercase;">Cuenta</h4>

            <div class="card config-card">
                <div style="display:flex; align-items:center;">
                    <span class="material-symbols-outlined config-icon">mail</span>
                    <div>
                        <h3 style="margin:0; font-size:16px;">Correo Electrónico</h3>
                        <p id="user-email" style="margin:0; font-size:13px; color:#666;">Cargando...</p>
                    </div>
                </div>
            </div>

            <div class="card config-card">
                <div style="display:flex; align-items:center;">
                    <span class="material-symbols-outlined config-icon">lock_reset</span>
                    <div>
                        <h3 style="margin:0; font-size:16px;">Contraseña</h3>
                        <p style="margin:0; font-size:13px; color:#666;">Enviar correo de recuperación</p>
                    </div>
                </div>
                <button id="btnResetPassword" class="btn-action">Restablecer</button>
            </div>
        </div>
    </div>

    <footer></footer>
    <script type="module" src="./usuarios.js"></script>
    <script type="module" src="./configuraciones.js"></script> </body>
</html>
</body>
</html>
